name: Isembard
description: >-
  Isembard is a UK- and US-based advanced manufacturing company building a
  distributed network of software-powered precision factories for critical
  industries including aerospace, defence, space, satellites, drones, nuclear
  energy, and motorsport. Founded in 2024 by Alexander Fitzgerald and named
  after engineer Isambard Kingdom Brunel, the company runs its factories on
  MasonOS, a proprietary AI-powered operating system that manages quoting,
  scheduling, production, and quality control across its factory network. Its
  model reshores high-precision component manufacturing closer to home to
  address supply-chain vulnerabilities in the Western industrial base, scaling
  from prototypes to production and offering factory franchise opportunities.
  Isembard has raised a Series A led by Union Square Ventures and operates
  factories across the UK, US, France, and Germany. There is no public developer
  API; MasonOS is an internal software platform, so this profile captures the
  company's identity and web surface rather than an API.
